buildscript {
  def kotlinVersion = rootProject.ext.has('kotlinVersion')
    ? rootProject.ext.get('kotlinVersion')
    : project.findProperty('FaceProximity_kotlinVersion') ?: '2.1.20'
  repositories { google(); mavenCentral() }
  dependencies {
    if (project == rootProject) {
      classpath 'com.android.tools.build:gradle:8.5.2'
    }
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace 'com.faceproximity'
  compileSdkVersion rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
  defaultConfig {
    minSdkVersion rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 21
    targetSdkVersion rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
  kotlinOptions { jvmTarget = '11' }
}

repositories { google(); mavenCentral() }

dependencies {
  // The host app provides React Native at runtime. The fallback version lets this
  // library compile by itself without forcing that version into consuming apps.
  def hostReactNativePackage = new File(projectDir, '../../react-native/package.json')
  def detectedReactNativeVersion = hostReactNativePackage.exists()
    ? new groovy.json.JsonSlurper().parseText(hostReactNativePackage.text).version
    : null
  def reactNativeCompileVersion = project.findProperty('FaceProximity_reactNativeVersion')
    ?: detectedReactNativeVersion
    ?: '0.82.1'
  compileOnly "com.facebook.react:react-android:$reactNativeCompileVersion"
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
}
