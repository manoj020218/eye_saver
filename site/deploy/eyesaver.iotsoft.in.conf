# nginx site for https://eyesaver.iotsoft.in
# Install to /etc/nginx/sites-available/eyesaver.iotsoft.in and symlink into sites-enabled.
# Start with this HTTP-only block; `certbot --nginx -d eyesaver.iotsoft.in` then adds
# the HTTPS server block and the HTTP -> HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name eyesaver.iotsoft.in;

    root /var/www/eyesaver.iotsoft.in;
    index index.html;

    # Security headers (static site: no scripts, no third-party content)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        # add_header in a location replaces inherited ones, so repeat the essentials
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never serve dotfiles or the deploy folder if it is ever uploaded by mistake
    location ~ /\.  { deny all; }
    location /deploy/ { deny all; }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/xml text/plain;
}
